name: Build and Release (Multi-Platform)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - { os: linux,   arch: amd64, ext: '',    name: 'linux-amd64' }
          - { os: windows, arch: amd64, ext: '.exe', name: 'windows-amd64' }

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.13'
          cache: true
          cache-dependency-path: go.sum

      - name: Build for ${{ matrix.platform.name }}
        run: |
          mkdir -p ./bin
          GOOS=${{ matrix.platform.os }} GOARCH=${{ matrix.platform.arch }} go build -o ./bin/myapp${{ matrix.platform.ext }} .
          echo "✅ Built: ./bin/myapp${{ matrix.platform.ext }}"

      - name: Package for ${{ matrix.platform.name }}
        run: |
          mkdir -p ./release/${{ matrix.platform.name }}
          cp ./bin/myapp${{ matrix.platform.ext }} ./release/${{ matrix.platform.name }}/myapp${{ matrix.platform.ext }}
          cd ./release/${{ matrix.platform.name }} && zip -r ../../myapp-${{ matrix.platform.name }}.zip myapp${{ matrix.platform.ext }}

      - name: Upload Artifact (${{ matrix.platform.name }})
        uses: actions/upload-artifact@v4  # ✅ 更新为 v4！
        with:
          name: myapp-${{ matrix.platform.name }}
          path: ./myapp-${{ matrix.platform.name }}.zip
